# Single source of configuration for every layer (replaces tfvars files).
#
# Top-level sections:
#   global     settings shared by all layers
#   tfbackend  remote state storage, read by the backend layer and the scripts (via yq).
#              rg_name, storage_acct and container_name may name existing resources.
#              Each environment needs its own storage_acct or container_name.
#   layers     one block per layer, keyed by the full directory name, number included
#              (layers/01-example reads layers.01-example)
#
# Environment overrides: where a value differs per environment, add a key named
# after the environment (as listed in global.environments) inside the block. Its
# settings are merged over the block's plain settings. One level deep only.

global:
  environments: [DEV]
  location: northeurope
  # azurerm v5 does not auto-register resource providers. List what the layers need;
  # every layer's provider block reads this list.
  resource_providers:
    - Microsoft.Storage
  tags:
    created_by: your-name

tfbackend:
  rg_name: myproject_tfbackend
  container_name: tfstate
  # One storage account per environment (names are globally unique, lowercase alphanumeric).
  DEV:
    storage_acct: myprojecttfbackenddev
  # PROD:
  #   storage_acct: myprojecttfbackendprod

layers:
  01-example:
    rg_name: myproject_example
